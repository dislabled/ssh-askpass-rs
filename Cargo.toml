[package]
name = "ssh-askpass-rs"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ssh-askpass-rs"
path = "src/main.rs"

[dependencies]
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSResponder",
    "NSRunningApplication",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSThread"] }
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4", features = ["crypto-rust"] }
